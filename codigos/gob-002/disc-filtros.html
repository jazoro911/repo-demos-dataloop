<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Discrepancia - Filtros</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
body { margin: 0; padding: 10px; background: #f4f7fb; font-family: 'Open Sans', sans-serif; font-size: 12px; }
.filtros { display: flex; gap: 12px; flex-wrap: wrap; padding: 12px; background: white; border-radius: 8px; border: 1px solid #BFD3E6; }
.filtro-grupo { display: flex; align-items: center; gap: 8px; }
.filtro-label { font-weight: 600; color: #1C334F; font-size: 11px; }
input, select { padding: 6px 10px; border: 1px solid #BFD3E6; border-radius: 4px; font-size: 11px; }
</style>
</head>
<body>
<div class="filtros">
  <div class="filtro-grupo">
    <label class="filtro-label">RAZÓN SOCIAL</label>
    <input type="text" id="f-razon" placeholder="Escribe para filtrar..." style="width: 200px;">
  </div>
  <div class="filtro-grupo">
    <label class="filtro-label">NIT</label>
    <input type="text" id="f-nit" placeholder="Escribe para filtrar..." style="width: 150px;">
  </div>
  <div class="filtro-grupo">
    <label class="filtro-label">PERÍODOS Y ACT. ECONÓMICA</label>
    <select id="f-periodo" style="width: 150px;">
      <option>Períodos</option>
      <option>Enero</option>
      <option>Febrero</option>
      <option>Marzo</option>
    </select>
  </div>
</div>

<script>
var $ = function(id) { return document.getElementById(id); };
$('f-razon').addEventListener('input', function(){ applyFilters(); });
$('f-nit').addEventListener('input', function(){ applyFilters(); });
function applyFilters(){
  var razon = $('f-razon').value.toLowerCase();
  var nit = $('f-nit').value.toLowerCase();
  // Aquí iría la lógica de filtrado si se integra con una tabla
  console.log('Filtros aplicados:', {razon, nit});
}
</script>
</body>
</html>
