<!DOCTYPE html>
<html lang="es">
<head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Zonal - Mapa</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
body { margin: 0; padding: 0; }
#zon-map { width: 100%; height: 100vh; }
</style>
</head>
<body>
<div id="zon-map"></div>
<script>
var mapObj = L.map('zon-map').setView([4.6,-74.1], 5);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:12, minZoom:4, attribution:'© OpenStreetMap'}).addTo(mapObj);
var ciudades = [
  {name: 'Bogotá', lat: 4.7110, lng: -74.0721, n: 33},
  {name: 'Medellín', lat: 6.2442, lng: -75.5812, n: 15},
  {name: 'Cali', lat: 3.4516, lng: -76.5320, n: 12}
];
ciudades.forEach(function(c){
  L.circle([c.lat, c.lng], {radius: 50000, color: '#1a7a3a', fillOpacity: 0.6}).bindPopup(c.name + ': ' + c.n + ' registros').addTo(mapObj);
});
</script>
</body>
</html>
