<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de Objetos - gob-002</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #f8f9fa;
            color: #1C334F;
            font-family: 'Open Sans', sans-serif;
            font-size: 13px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            background: linear-gradient(135deg, #006341 0%, #1a5c36 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
            border-bottom: 3px solid #9b1c2e;
        }
        
        .header__title {
            font-family: 'Montserrat', sans-serif;
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 6px;
        }
        
        .header__desc {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .breadcrumb {
            margin-bottom: 20px;
            font-size: 12px;
        }
        
        .breadcrumb a {
            color: #006341;
            text-decoration: none;
            font-weight: 600;
        }
        
        .breadcrumb a:hover {
            text-decoration: underline;
        }
        
        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .filter-btn {
            padding: 6px 14px;
            border: 1px solid #C5D5E8;
            background: white;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            color: #6B8AAB;
        }
        
        .filter-btn.active {
            background: #006341;
            color: white;
            border-color: #006341;
        }
        
        .filter-btn:hover {
            border-color: #006341;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .card {
            background: white;
            border: 1px solid #C5D5E8;
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        
        .card:hover {
            border-color: #006341;
            box-shadow: 0 8px 24px rgba(0, 99, 65, 0.12);
            transform: translateY(-4px);
        }
        
        .card__preview {
            height: 140px;
            background: linear-gradient(135deg, #006341 0%, #2d7a5e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 48px;
            flex-shrink: 0;
        }
        
        .card__preview.kpi { background: linear-gradient(135deg, #006341 0%, #2d7a5e 100%); }
        .card__preview.chart { background: linear-gradient(135deg, #007f5f 0%, #4a9f7a 100%); }
        .card__preview.table { background: linear-gradient(135deg, #9b1c2e 0%, #c03e50 100%); }
        .card__preview.control { background: linear-gradient(135deg, #b8860b 0%, #d4a535 100%); }
        .card__preview.mapa { background: linear-gradient(135deg, #1e5a6d 0%, #3d8aa0 100%); }
        
        .card__content {
            padding: 16px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .card__title {
            font-weight: 700;
            color: #1C334F;
            font-size: 13px;
            line-height: 1.3;
        }
        
        .card__desc {
            font-size: 11px;
            color: #6B8AAB;
            line-height: 1.4;
            flex: 1;
        }
        
        .card__meta {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 8px;
        }
        
        .badge {
            padding: 2px 8px;
            background: #f0f4f8;
            border: 1px solid #C5D5E8;
            border-radius: 4px;
            font-size: 9px;
            color: #6B8AAB;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .02em;
        }
        
        .badge.type {
            background: #006341;
            color: white;
            border-color: #006341;
        }
        
        .card__actions {
            display: flex;
            gap: 8px;
            padding-top: 12px;
            border-top: 1px solid #C5D5E8;
        }
        
        .btn {
            flex: 1;
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-secondary {
            background: #f0f4f8;
            color: #1C334F;
            border: 1px solid #C5D5E8;
        }
        
        .btn-secondary:hover {
            background: #e8eef5;
            border-color: #006341;
        }
        
        .btn-primary {
            background: #006341;
            color: white;
        }
        
        .btn-primary:hover {
            background: #005030;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .stat {
            background: white;
            border: 1px solid #C5D5E8;
            border-radius: 8px;
            padding: 16px;
            text-align: center;
        }
        
        .stat__number {
            font-size: 28px;
            font-weight: 800;
            color: #006341;
            margin-bottom: 4px;
        }
        
        .stat__label {
            font-size: 11px;
            color: #6B8AAB;
            text-transform: uppercase;
            letter-spacing: .04em;
            font-weight: 600;
        }
        
        .carrito-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #006341;
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0, 99, 65, 0.25);
            transition: all 0.2s;
            z-index: 100;
        }
        
        .carrito-btn:hover {
            background: #005030;
            box-shadow: 0 6px 16px rgba(0, 99, 65, 0.35);
        }
        
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #22c55e;
            color: white;
            padding: 12px 16px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            animation: slideIn 0.3s ease;
            z-index: 1000;
        }
        
        @keyframes slideIn {
            from { transform: translateY(100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="breadcrumb">
        <a href="../../../index.html">📊 Dashboard</a> /
        <a href="../../categorias/gobierno.html">🏛️ Gobierno</a> /
        <a href="gob-002.html">Brecha de Recaudación</a> /
        <strong>Galería de Objetos</strong>
    </div>
    
    <div class="header">
        <div class="header__title">🎨 Galería de Objetos</div>
        <div class="header__desc">Brecha de Recaudación - 4 Páginas • 16 Objetos</div>
    </div>
    
    <div class="stats">
        <div class="stat">
            <div class="stat__number" id="stat-total">16</div>
            <div class="stat__label">Objetos Disponibles</div>
        </div>
        <div class="stat">
            <div class="stat__number" id="stat-seleccionados">0</div>
            <div class="stat__label">En Tu Carrito</div>
        </div>
        <div class="stat">
            <div class="stat__number">4</div>
            <div class="stat__label">Páginas</div>
        </div>
    </div>
    
    <div class="filters">
        <button class="filter-btn active" data-filter="all">Todos (16)</button>
        <button class="filter-btn" data-filter="home">🏠 HOME (3)</button>
        <button class="filter-btn" data-filter="discrepancia">📊 DISCREPANCIA (5)</button>
        <button class="filter-btn" data-filter="analisis">📈 ANÁLISIS (3)</button>
        <button class="filter-btn" data-filter="zonal">🗺️ ZONAL (5)</button>
    </div>
    
    <div class="grid" id="gallery-grid">
        <!-- Se llena con JavaScript -->
    </div>
</div>

<button class="carrito-btn" onclick="mostrarCarrito()">🛒 Ver Carrito</button>

<script>
var catalogo = {
    "objetos": [
        {
            "id": "gob-002-home-bar-razon",
            "nombre": "Bar Chart - Razón Social",
            "tipo": "chart",
            "pagina": "home",
            "ruta": "home-bar-razon.html",
            "tags": ["chart", "bar", "empresas"],
            "descripcion": "Empresas con mayores discrepancias ordenadas por monto",
            "icono": "📊"
        },
        {
            "id": "gob-002-home-map",
            "nombre": "Mapa - Distribución Geográfica",
            "tipo": "mapa",
            "pagina": "home",
            "ruta": "home-map.html",
            "tags": ["mapa", "leaflet", "geo"],
            "descripcion": "Mapa interactivo con clusters de municipios y marcadores",
            "icono": "🗺️"
        },
        {
            "id": "gob-002-home-treemap",
            "nombre": "Treemap - Análisis Jerárquico",
            "tipo": "chart",
            "pagina": "home",
            "ruta": "home-treemap.html",
            "tags": ["chart", "treemap", "distribución"],
            "descripcion": "Distribución visual de discrepancias en formato treemap",
            "icono": "📈"
        },
        {
            "id": "gob-002-disc-filtros",
            "nombre": "Filtros - Búsqueda",
            "tipo": "control",
            "pagina": "discrepancia",
            "ruta": "disc-filtros.html",
            "tags": ["filtros", "control", "búsqueda"],
            "descripcion": "Panel de filtros para razón social, NIT y período",
            "icono": "🔍"
        },
        {
            "id": "gob-002-disc-bar-chart",
            "nombre": "Chart - Facturación vs Ingresos",
            "tipo": "chart",
            "pagina": "discrepancia",
            "ruta": "disc-bar-chart.html",
            "tags": ["chart", "comparación", "discrepancia"],
            "descripcion": "Comparación de facturación electrónica vs ingresos declarados",
            "icono": "📊"
        },
        {
            "id": "gob-002-disc-tab-contribuyentes",
            "nombre": "Tabla - Contribuyentes Discrepancias",
            "tipo": "table",
            "pagina": "discrepancia",
            "ruta": "disc-tab-contribuyentes.html",
            "tags": ["tabla", "datos", "discrepancia"],
            "descripcion": "Listado de contribuyentes con discrepancias detectadas",
            "icono": "📋"
        },
        {
            "id": "gob-002-disc-tab-detalle",
            "nombre": "Tabla - Detalle Discrepancias",
            "tipo": "table",
            "pagina": "discrepancia",
            "ruta": "disc-tab-detalle.html",
            "tags": ["tabla", "detalle", "información"],
            "descripcion": "Detalles completos de discrepancias con datos de ubicación",
            "icono": "📋"
        },
        {
            "id": "gob-002-disc-kpi",
            "nombre": "KPIs - Discrepancias",
            "tipo": "kpi",
            "pagina": "discrepancia",
            "ruta": "disc-kpi.html",
            "tags": ["kpi", "métrica", "discrepancia"],
            "descripcion": "Indicadores clave de discrepancias detectadas",
            "icono": "💰"
        },
        {
            "id": "gob-002-analisis-botones",
            "nombre": "Botones Filtro - Sectores",
            "tipo": "control",
            "pagina": "analisis",
            "ruta": "analisis-botones.html",
            "tags": ["control", "botones", "sector"],
            "descripcion": "Panel de botones para filtrar por sector económico",
            "icono": "🎯"
        },
        {
            "id": "gob-002-analisis-bar",
            "nombre": "Bar Chart - Nivel de Atraso",
            "tipo": "chart",
            "pagina": "analisis",
            "ruta": "analisis-bar.html",
            "tags": ["chart", "bar", "atraso"],
            "descripcion": "Distribución de contribuyentes por nivel de atraso",
            "icono": "📊"
        },
        {
            "id": "gob-002-analisis-table",
            "nombre": "Tabla - Contribuyentes Prioritarios",
            "tipo": "table",
            "pagina": "analisis",
            "ruta": "analisis-table.html",
            "tags": ["tabla", "prioritarios", "riesgo"],
            "descripcion": "Lista de contribuyentes prioritarios con propensión a evasión",
            "icono": "📋"
        },
        {
            "id": "gob-002-zon-filtros",
            "nombre": "Filtros - Municipio y Empresa",
            "tipo": "control",
            "pagina": "zonal",
            "ruta": "zon-filtros.html",
            "tags": ["filtros", "zonal", "municipio"],
            "descripcion": "Filtros para seleccionar municipio, empresa y tipo de alerta",
            "icono": "🔍"
        },
        {
            "id": "gob-002-zon-kpi",
            "nombre": "KPIs - Resumen Zonal",
            "tipo": "kpi",
            "pagina": "zonal",
            "ruta": "zon-kpi.html",
            "tags": ["kpi", "zonal", "resumen"],
            "descripcion": "KPIs de resumen a nivel zonal",
            "icono": "💰"
        },
        {
            "id": "gob-002-zon-bar",
            "nombre": "Bar Chart - Empresas Zonal",
            "tipo": "chart",
            "pagina": "zonal",
            "ruta": "zon-bar.html",
            "tags": ["chart", "zonal", "empresas"],
            "descripcion": "Empresas con mayores discrepancias a nivel zonal",
            "icono": "📊"
        },
        {
            "id": "gob-002-zon-map",
            "nombre": "Mapa - Zonal Interactivo",
            "tipo": "mapa",
            "pagina": "zonal",
            "ruta": "zon-map.html",
            "tags": ["mapa", "zonal", "geo"],
            "descripcion": "Mapa interactivo con distribución geográfica de discrepancias",
            "icono": "🗺️"
        },
        {
            "id": "gob-002-zon-tablas",
            "nombre": "Tablas - ISR, Aduanas, IVA",
            "tipo": "table",
            "pagina": "zonal",
            "ruta": "zon-tablas.html",
            "tags": ["tabla", "impuestos", "zonal"],
            "descripcion": "Tablas con discrepancias por tipo de impuesto",
            "icono": "📋"
        }
    ]
};

var carritoSeleccionados = [];
var filtroActual = 'all';

function cargarCarrito() {
    try {
        carritoSeleccionados = JSON.parse(localStorage.getItem('gob-002-carrito') || '[]');
    } catch(e) {
        carritoSeleccionados = [];
    }
    actualizarStats();
}

function guardarCarrito() {
    localStorage.setItem('gob-002-carrito', JSON.stringify(carritoSeleccionados));
    actualizarStats();
}

function actualizarStats() {
    document.getElementById('stat-seleccionados').textContent = carritoSeleccionados.length;
}

function renderGallery() {
    var grid = document.getElementById('gallery-grid');
    var objetos = catalogo.objetos;
    
    if (filtroActual !== 'all') {
        objetos = objetos.filter(function(obj) {
            return obj.pagina === filtroActual;
        });
    }
    
    grid.innerHTML = objetos.map(function(obj) {
        var isSelected = carritoSeleccionados.includes(obj.id);
        return '<div class="card">' +
            '<div class="card__preview ' + obj.tipo + '">' + obj.icono + '</div>' +
            '<div class="card__content">' +
                '<div class="card__title">' + obj.nombre + '</div>' +
                '<div class="card__desc">' + obj.descripcion + '</div>' +
                '<div class="card__meta">' +
                    '<span class="badge type">' + obj.tipo + '</span>' +
                    '<span class="badge">' + obj.pagina + '</span>' +
                    obj.tags.slice(0, 2).map(function(tag) {
                        return '<span class="badge">' + tag + '</span>';
                    }).join('') +
                '</div>' +
            '</div>' +
            '<div class="card__actions">' +
                '<button class="btn btn-secondary" onclick="verObjeto(\'' + obj.ruta + '\')">👁️ Ver</button>' +
                '<button class="btn btn-primary" onclick="agregarCarrito(\'' + obj.id + '\')">' +
                    (isSelected ? '✓ Agregado' : '➕ Carrito') +
                '</button>' +
            '</div>' +
        '</div>';
    }).join('');
}

function agregarCarrito(id) {
    if (!carritoSeleccionados.includes(id)) {
        carritoSeleccionados.push(id);
        guardarCarrito();
        renderGallery();
        mostrarToast('Objeto agregado al carrito');
    } else {
        carritoSeleccionados = carritoSeleccionados.filter(function(item) {
            return item !== id;
        });
        guardarCarrito();
        renderGallery();
        mostrarToast('Objeto removido del carrito');
    }
}

function verObjeto(ruta) {
    window.open(ruta, '_blank');
}

function mostrarCarrito() {
    if (carritoSeleccionados.length === 0) {
        alert('Tu carrito está vacío');
        return;
    }
    var msg = 'Carrito (' + carritoSeleccionados.length + ' objetos):\n\n';
    msg += carritoSeleccionados.map(function(id) {
        var obj = catalogo.objetos.find(function(o) { return o.id === id; });
        return '✓ ' + obj.nombre + ' (' + obj.pagina + ')';
    }).join('\n');
    alert(msg);
}

function mostrarToast(msg) {
    var toast = document.createElement('div');
    toast.className = 'toast';
    toast.textContent = msg;
    document.body.appendChild(toast);
    setTimeout(function() { toast.remove(); }, 2000);
}

document.querySelectorAll('.filter-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
        document.querySelectorAll('.filter-btn').forEach(function(b) {
            b.classList.remove('active');
        });
        this.classList.add('active');
        filtroActual = this.getAttribute('data-filter');
        renderGallery();
    });
});

cargarCarrito();
renderGallery();
</script>

</body>
</html>
