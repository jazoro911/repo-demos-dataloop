<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Discrepancia - Bar Chart</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #1C334F;
  --green: #2ea84e;
  --red: #d32f2f;
}
* { box-sizing: border-box; }
body { margin: 0; padding: 10px; background: #f4f7fb; }
.card { background: white; border: 1px solid #BFD3E6; border-radius: 10px; padding: 16px 18px; }
.card-title { font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 12px; color: var(--navy); text-transform: uppercase; margin-bottom: 12px; }
.divider { width: 28px; height: 3px; background: var(--green); margin-bottom: 12px; }
.chart-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.label { font-size: 10px; font-weight: 600; width: 100px; flex-shrink: 0; }
.bars { display: flex; gap: 4px; flex: 1; }
.bar { height: 24px; border-radius: 3px; transition: opacity .15s; }
.bar:hover { opacity: .8; }
.bar-green { background: var(--green); }
.bar-red { background: var(--red); }
.val { font-size: 10px; font-weight: 700; width: 60px; text-align: right; }
</style>
</head>
<body>
<div class="card">
  <div class="card-title">Facturación electrónica reportada vs Ingresos declarados</div>
  <div class="divider"></div>
  <div id="disc-bar-chart"></div>
</div>

<script>
var DEMO = [
  {mes: '01-Enero', fact: 450, ing: 380},
  {mes: '02-Febrero', fact: 420, ing: 310},
  {mes: '03-Marzo', fact: 510, ing: 420},
  {mes: '04-Abril', fact: 480, ing: 390},
  {mes: '05-Mayo', fact: 560, ing: 480}
];

function buildDiscBar(){
  var maxVal = 600;
  var html = '';
  DEMO.forEach(function(d){
    var pctF = (d.fact / maxVal) * 100;
    var pctI = (d.ing / maxVal) * 100;
    html += '<div class="chart-row">' +
      '<div class="label">' + d.mes + '</div>' +
      '<div class="bars">' +
      '<div class="bar bar-green" style="width:' + pctF + 'px;" title="Facturación: ' + d.fact + '"></div>' +
      '<div class="bar bar-red" style="width:' + pctI + 'px;" title="Ingresos: ' + d.ing + '"></div>' +
      '</div>' +
      '</div>';
  });
  document.getElementById('disc-bar-chart').innerHTML = html;
}

buildDiscBar();
</script>
</body>
</html>
