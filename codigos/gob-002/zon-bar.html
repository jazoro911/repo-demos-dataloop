<!DOCTYPE html>
<html lang="es">
<head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Zonal - Bar Chart</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
body { margin: 0; padding: 10px; background: #f4f7fb; }
.card { background: white; border: 1px solid #BFD3E6; border-radius: 10px; padding: 16px; }
.card-title { font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 12px; color: #1C334F; text-transform: uppercase; margin-bottom: 12px; }
.bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.label { font-size: 10px; font-weight: 600; width: 140px; }
.bar { flex: 1; height: 20px; background: #1a7a3a; border-radius: 3px; }
.val { font-size: 10px; font-weight: 700; width: 50px; text-align: right; }
</style>
</head>
<body>
<div class="card">
  <div class="card-title">Empresas con mayores discrepancias</div>
  <div id="zon-bar">
    <div class="bar-row"><div class="label">Comercializadora Caribe</div><div class="bar" style="width:95%"></div><div class="val">$ 8M</div></div>
    <div class="bar-row"><div class="label">EMPRESA_001452</div><div class="bar" style="width:62%"></div><div class="val">$ 5.2M</div></div>
    <div class="bar-row"><div class="label">EMPRESA_001568</div><div class="bar" style="width:59%"></div><div class="val">$ 5M</div></div>
  </div>
</div>
</body>
</html>
