<!DOCTYPE html>
<html lang="es">
<head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Zonal - Filtros</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
body { margin: 0; padding: 10px; background: #f4f7fb; font-family: 'Open Sans', sans-serif; }
.filtros { display: flex; gap: 12px; flex-wrap: wrap; padding: 12px; background: white; border-radius: 8px; border: 1px solid #BFD3E6; }
.filtro-grupo { display: flex; align-items: center; gap: 8px; }
.filtro-label { font-weight: 600; color: #1C334F; font-size: 11px; }
select { padding: 6px 10px; border: 1px solid #BFD3E6; border-radius: 4px; font-size: 11px; }
</style>
</head>
<body>
<div class="filtros">
  <div class="filtro-grupo">
    <label class="filtro-label">REGLA ROTA</label>
    <select><option>TIPO_ALERTA</option></select>
  </div>
  <div class="filtro-grupo">
    <label class="filtro-label">TAMANO EMPRESA</label>
    <select><option>TAMANO_EMPRESA</option></select>
  </div>
  <div class="filtro-grupo">
    <label class="filtro-label">MUNICIPIO</label>
    <select><option>MUNICIPIO</option></select>
  </div>
</div>
</body>
</html>
