<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Home - Mapa Geográfico</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<style>
body { margin: 0; padding: 0; }
#home-map { width: 100%; height: 100vh; }
.pie-cluster-icon, .alerta-marker-icon { border-radius: 50%; }
</style>
</head>
<body>
<div id="home-map"></div>

<script>
var COORDS_MUNICIPIOS = {
  'Bogotá':[4.7110,-74.0721],'Medellín':[6.2442,-75.5812],'Cali':[3.4516,-76.5320],
  'Barranquilla':[10.9685,-74.7813],'Cartagena':[10.3910,-75.4794],'Bucaramanga':[7.1193,-73.1227],
  'Santa Marta':[11.2408,-74.1990],'Cúcuta':[7.8939,-72.5078],'Pereira':[4.8133,-75.6961],
  'Ibagué':[4.4389,-75.2322],'Villavicencio':[4.1420,-73.6266],'Palmira':[3.5394,-76.3036]
};

var fmt = new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', minimumFractionDigits: 0 });
var MUNICIPIOS_ZON = [
  {mun: 'Bogotá', n: 33}, {mun: 'Medellín', n: 15}, {mun: 'Cali', n: 12},
  {mun: 'Barranquilla', n: 8}, {mun: 'Cartagena', n: 6}
];

function colorAlerta(tipo){
  var t = String(tipo || '').toLowerCase();
  if(t.indexOf('facturaci') >= 0) return '#1565C0';
  if(t.indexOf('iva') >= 0) return '#e8a900';
  if(t.indexOf('propensi') >= 0) return '#9c27b0';
  return '#1a7a3a';
}

function svgCirculo(size, color, label){
  var r = size/2, ir = r-2;
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'+
    '<circle cx="'+r+'" cy="'+r+'" r="'+ir+'" fill="'+color+'" fill-opacity="0.75" stroke="#fff" stroke-width="2"/>'+
    '<text x="'+r+'" y="'+r+'" text-anchor="middle" dy=".35em" font-size="'+Math.max(9,size/3.2)+'" font-weight="700" fill="#fff">'+label+'</text></svg>';
}

function crearMapa(elId){
  var el = document.getElementById(elId);
  if(!el) return null;
  var map = L.map(elId, {zoomControl:true, scrollWheelZoom:false}).setView([4.6,-74.1], 5);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:12, minZoom:4, attribution:'© OpenStreetMap'}).addTo(map);
  return map;
}

function pintarMarcadores(map){
  if(!map) return;
  var maxN = Math.max.apply(null, MUNICIPIOS_ZON.map(function(m){ return m.n; })) || 1;
  var cluster = L.markerClusterGroup({maxClusterRadius:50});
  
  MUNICIPIOS_ZON.forEach(function(m){
    var c = COORDS_MUNICIPIOS[m.mun];
    if(!c) return;
    var sz = 16 + (m.n/maxN)*28;
    var icon = L.divIcon({html:'<div style="position:relative">'+svgCirculo(sz, '#1a7a3a', m.n)+'</div>', className:'alerta-marker-icon', iconSize:[sz,sz], iconAnchor:[sz/2,sz/2]});
    var marker = L.marker([c[0], c[1]], {icon:icon});
    marker.bindPopup('<div><div style="font-weight:700;color:#1C334F;margin-bottom:8px">'+m.mun+'</div><div>Registros: <strong>'+m.n+'</strong></div></div>');
    cluster.addLayer(marker);
  });
  
  map.addLayer(cluster);
  try{ map.fitBounds(cluster.getBounds(), {padding:[40,40], maxZoom:7}); }catch(e){}
}

var mapObj = null;
function buildGeoMap(elId){
  if(mapObj) return;
  mapObj = crearMapa(elId);
  pintarMarcadores(mapObj);
  setTimeout(function(){ if(mapObj) mapObj.invalidateSize(); }, 200);
}

buildGeoMap('home-map');
</script>
</body>
</html>
