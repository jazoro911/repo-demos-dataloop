<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>KPI - Contribuyentes en Alerta</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">

<style>
.gob-kpi-contribuyentes {
  --gkc-bg: #ffffff;
  --gkc-border: #C5D5E8;
  --gkc-muted: #6B8AAB;
  --gkc-bar-color: #9b1c2e;
  --gkc-title-color: #1C334F;
}

*, *::before, *::after { box-sizing: border-box; }

.gob-kpi-contribuyentes {
  background: var(--gkc-bg);
  border: 1px solid var(--gkc-border);
  border-radius: 12px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  height: 100%;
  width: 100%;
  font-family: 'Open Sans', sans-serif;
  font-size: 13px;
}

.gob-kpi-contribuyentes__bar {
  height: 8px;
  width: 100%;
  background: var(--gkc-bar-color);
  flex-shrink: 0;
}

.gob-kpi-contribuyentes__content {
  flex: 1;
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.gob-kpi-contribuyentes__value {
  font-size: 32px;
  font-weight: 900;
  color: var(--gkc-bar-color);
  line-height: 1.1;
  margin: 0;
}

.gob-kpi-contribuyentes__label {
  color: var(--gkc-muted);
  text-transform: uppercase;
  letter-spacing: .08em;
  font-weight: 600;
  font-size: 10px;
  margin-top: 6px;
  margin-bottom: 2px;
}

.gob-kpi-contribuyentes__title {
  color: var(--gkc-title-color);
  font-size: 12px;
  font-weight: 700;
  line-height: 1.3;
  margin: 0;
}

.gob-kpi-contribuyentes__meta {
  color: var(--gkc-muted);
  font-size: 10px;
  margin-top: 4px;
}

.gob-kpi-contribuyentes__error {
  color: #b91c1c;
  font-size: 10px;
  display: none;
  white-space: pre-wrap;
  margin-top: 6px;
}
</style>
</head>
<body style="margin: 0; padding: 10px; height: 100vh; display: flex;">

<div class="gob-kpi-contribuyentes">
  <div class="gob-kpi-contribuyentes__bar"></div>
  <div class="gob-kpi-contribuyentes__content">
    <div class="gob-kpi-contribuyentes__label">Riesgo Fiscal</div>
    <div class="gob-kpi-contribuyentes__value" id="valor">—</div>
    <div class="gob-kpi-contribuyentes__title">Contribuyentes en Alerta</div>
    <div class="gob-kpi-contribuyentes__meta">Probabilidad de evasión > 70%</div>
    <div class="gob-kpi-contribuyentes__error" id="error"></div>
  </div>
</div>

<script>
window.addEventListener('message', function(evt) {
  var m = evt.data || {};
  var cols = m.rankingColumns || m.columns || [];
  var rows = m.rankingData || m.data || [];
  
  if (cols.length && rows.length) {
    try {
      var idxContribuyentes = cols.findIndex(function(c) {
        var name = (c.label || c.name || c || '').toString().trim().toUpperCase();
        return name.includes('CONTRIBUYENTE') || name.includes('ALERTA');
      });
      
      if (idxContribuyentes >= 0) {
        var valores = rows.map(function(row) {
          return parseFloat(row[idxContribuyentes]);
        }).filter(function(v) { return isFinite(v); });
        
        if (valores.length > 0) {
          var total = valores.reduce(function(a, b) { return a + b; }, 0);
          document.getElementById('valor').textContent = Math.round(total).toLocaleString('es-MX');
          document.getElementById('error').style.display = 'none';
        }
      }
    } catch(e) {
      document.getElementById('error').textContent = e.message;
      document.getElementById('error').style.display = 'block';
    }
  }
});

try { 
  if (window.parent) window.parent.postMessage({ type: 'ready', object: 'gob-001-kpi-contribuyentes' }, '*'); 
} catch(e) {}

document.getElementById('valor').textContent = '3,247';
</script>

</body>
</html>
