<title>Brecha de Recaudación – HOME DIAN</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ── Variables globales ── */
:root {
  --bg: #ffffff;
  --border: #BFD3E6;
  --muted: #6B8AAB;
  --navy: #1C334F;
  --green: #1a7a3a;
  --green-light: #2ea84e;
  --green-dark: #145e2c;
  --yellow: #e8a900;
  --yellow-light: #f5c842;
  --blue-kpi: #1565C0;
  --red-kpi: #c62828;
  --teal-kpi: #00695c;
  --white: #ffffff;
  --offwhite: #f4f7fb;
  --track-bg: #F2F4F7;
  --text: #1C334F;
  --surface: #ffffff;
  --tab-active: #1a7a3a;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; padding: 0; }

body {
  background: var(--offwhite);
  color: var(--text);
  font-family: 'Open Sans', sans-serif;
  font-size: 13px;
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}

/* ── Nav tabs ── */
.top-nav {
  background: var(--white);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 0;
  flex-shrink: 0;
  height: 42px;
}

.nav-tab {
  padding: 0 18px;
  height: 42px;
  display: flex;
  align-items: center;
  font-family: 'Montserrat', sans-serif;
  font-size: 11px;
  font-weight: 600;
  color: var(--muted);
  cursor: pointer;
  border-bottom: 3px solid transparent;
  transition: color .15s, border-color .15s;
  white-space: nowrap;
  text-transform: uppercase;
  letter-spacing: .04em;
}
.nav-tab:hover { color: var(--navy); }
.nav-tab.active { color: var(--tab-active); border-bottom-color: var(--tab-active); }

/* ── Filters bar ── */
.filters-bar {
  background: var(--white);
  padding: 5px 20px;
  font-size: 11px;
  color: var(--muted);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

/* ── Pages ── */
.page { display: none; flex: 1; overflow: hidden; flex-direction: column; }
.page.active { display: flex; }

/* ── Page title ── */
.page-title {
  text-align: center;
  font-family: 'Montserrat', sans-serif;
  font-weight: 800;
  font-size: 22px;
  color: var(--navy);
  padding: 16px 0 10px;
  flex-shrink: 0;
  background: var(--offwhite);
}

/* ── Scrollable page body ── */
.page-body {
  flex: 1;
  overflow-y: auto;
  padding: 0 16px 16px;
}

/* ════════════════
   HOME DIAN
   ════════════════ */
.home-kpi-row {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 14px;
  margin-bottom: 14px;
}

.kpi-box {
  background: var(--white);
  border-radius: 10px;
  padding: 16px 18px;
  text-align: center;
  border: 2px solid var(--border);
}
.kpi-box.blue-border  { border-color: #1565C0; }
.kpi-box.yellow-border{ border-color: #e8a900; }
.kpi-box.green-border { border-color: #1a7a3a; }

.kpi-box .kpi-label {
  font-family: 'Montserrat', sans-serif;
  font-size: 12px;
  font-weight: 700;
  color: var(--navy);
  margin-bottom: 6px;
}
.kpi-box .kpi-value {
  font-family: 'Montserrat', sans-serif;
  font-size: 24px;
  font-weight: 800;
  line-height: 1.1;
}
.kpi-box.blue-border  .kpi-value { color: #1565C0; }
.kpi-box.yellow-border .kpi-value { color: #c68000; }
.kpi-box.green-border .kpi-value  { color: #1a7a3a; }

.kpi-box .kpi-link {
  font-size: 13px;
  font-weight: 700;
  color: var(--navy);
  text-decoration: underline;
  cursor: pointer;
}

.home-charts-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

/* ── Card base ── */
.card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px 18px;
  box-shadow: 0 1px 4px rgba(0,0,0,.05);
}

.card-title {
  font-family: 'Montserrat', sans-serif;
  font-weight: 700;
  font-size: 12px;
  color: var(--navy);
  text-transform: uppercase;
  letter-spacing: .5px;
  margin-bottom: 4px;
}

.divider {
  width: 28px; height: 3px;
  background: linear-gradient(90deg, var(--green-light), var(--green-dark));
  border-radius: 2px; margin: 4px 0 12px;
}

/* ── Horizontal bar chart ── */
.hbar-row {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 8px;
}
.hbar-label {
  font-size: 10px; font-weight: 600; width: 160px; flex-shrink: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--navy);
}
.hbar-track {
  flex: 1; height: 20px; background: var(--track-bg);
  border-radius: 4px; overflow: hidden;
}
.hbar-fill {
  height: 100%; border-radius: 4px;
  background: var(--green-light); min-width: 2px;
}
.hbar-val {
  font-size: 10px; font-weight: 700; width: 100px;
  text-align: right; flex-shrink: 0; color: var(--navy);
}

/* ── Treemap ── */
.treemap-container {
  display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px;
}
.treemap-tile {
  background: var(--yellow);
  border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  text-align: center;
  padding: 4px 6px;
  font-size: 10px; font-weight: 700; color: var(--white);
  cursor: pointer;
  transition: opacity .15s;
}
.treemap-tile:hover { opacity: .85; }

/* ── Map placeholder ── */
.map-placeholder {
  background: var(--track-bg);
  border: 2px dashed var(--border);
  border-radius: 8px;
  min-height: 260px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  color: var(--muted);
  text-align: center;
}
.map-placeholder-icon { font-size: 36px; opacity: .4; }
.map-placeholder-text { font-size: 12px; font-weight: 600; line-height: 1.6; color: var(--muted); }

/* ════════════════
   DISCREPANCIAS DETECTADAS
   ════════════════ */
.disc-filter-row {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr auto auto;
  gap: 10px;
  align-items: end;
  margin-bottom: 14px;
}

.filter-group { display: flex; flex-direction: column; gap: 4px; }
.filter-label { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }

.filter-input, .filter-select {
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 6px 10px;
  font-size: 12px;
  font-family: 'Open Sans', sans-serif;
  color: var(--navy);
  background: var(--white);
  outline: none;
}
.filter-input:focus, .filter-select:focus { border-color: var(--green-light); }

.kpi-pair { display: flex; gap: 10px; margin-bottom: 14px; }
.kpi-mini {
  flex: 1;
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 16px;
  text-align: center;
}
.kpi-mini .km-label { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.kpi-mini .km-value { font-family: 'Montserrat', sans-serif; font-size: 22px; font-weight: 800; }
.kpi-mini.green .km-value { color: var(--green-light); }
.kpi-mini.yellow .km-value { color: #c68000; }

/* Monto discrepancia filter pills */
.pill-filter { display: flex; gap: 6px; flex-wrap: wrap; }
.pill {
  padding: 3px 10px;
  border: 1px solid var(--border);
  border-radius: 20px;
  font-size: 10px; font-weight: 600; cursor: pointer;
  background: var(--white); color: var(--muted);
  transition: all .15s;
}
.pill.active { background: var(--green-light); border-color: var(--green-light); color: var(--white); }

/* Grouped bar chart */
.gbar-chart { width: 100%; }
.gbar-x-labels { display: flex; justify-content: space-around; font-size: 9px; color: var(--muted); margin-top: 4px; }
.gbar-group { display: flex; align-items: flex-end; justify-content: center; gap: 2px; flex: 1; }
.gbar-groups-row { display: flex; align-items: flex-end; height: 160px; gap: 2px; padding: 0 4px; }
.gbar { border-radius: 3px 3px 0 0; min-width: 14px; }
.gbar.green { background: var(--green-light); }
.gbar.red   { background: #e53935; }

.chart-legend { display: flex; gap: 14px; margin-top: 8px; flex-wrap: wrap; }
.chart-legend-item { display: flex; align-items: center; gap: 5px; font-size: 10px; color: var(--muted); }
.chart-legend-dot  { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }

/* stacking tabs */
.stacking-tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 12px; }
.stab {
  padding: 6px 16px;
  font-size: 11px; font-weight: 600;
  cursor: pointer; color: var(--muted);
  border-bottom: 2px solid transparent;
  transition: all .15s;
}
.stab.active { color: var(--green-light); border-bottom-color: var(--green-light); }

/* data table */
.data-table { width: 100%; border-collapse: collapse; font-size: 11px; }
.data-table th {
  text-align: left; font-weight: 700; color: var(--muted);
  font-size: 10px; text-transform: uppercase; letter-spacing: .04em;
  padding: 6px 8px; border-bottom: 1px solid var(--border);
}
.data-table td { padding: 5px 8px; border-bottom: 1px solid #f0f4f8; color: var(--navy); }
.data-table tr:last-child td { border-bottom: none; }
.data-table .amount { text-align: right; font-weight: 700; }
.data-table tr:hover td { background: var(--offwhite); }

/* ════════════════
   ANÁLISIS DE RECAUDACIÓN
   ════════════════ */
.button-bar {
  display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px;
}
.btn-tag {
  padding: 5px 14px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--white);
  font-size: 11px; font-weight: 600; cursor: pointer; color: var(--navy);
  transition: all .15s;
}
.btn-tag.active { background: var(--navy); color: var(--white); border-color: var(--navy); }

.analisis-body {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

/* ════════════════
   ZONIFICACIÓN
   ════════════════ */
.zon-filters {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 10px;
  margin-bottom: 14px;
}

.zon-body {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-bottom: 14px;
}

.zon-kpi-col {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.zon-kpi-box {
  border-radius: 8px;
  padding: 12px 16px;
  border: 2px solid;
}
.zon-kpi-box .zkpi-label { font-size: 11px; font-weight: 700; color: var(--navy); margin-bottom: 4px; }
.zon-kpi-box .zkpi-value { font-family: 'Montserrat', sans-serif; font-size: 18px; font-weight: 800; }
.zon-kpi-box.gold   { border-color: #e8a900; }
.zon-kpi-box.gold   .zkpi-value { color: #c68000; }
.zon-kpi-box.blue   { border-color: #1565C0; }
.zon-kpi-box.blue   .zkpi-value { color: #1565C0; }
.zon-kpi-box.teal   { border-color: #00695c; }
.zon-kpi-box.teal   .zkpi-value { color: #00695c; }
.zon-kpi-box.red    { border-color: #c62828; }
.zon-kpi-box.red    .zkpi-value { color: #c62828; }

</style>

function showPage(name){
  // En SAS cada pestaña es un Data Driven Content independiente.
  // La navegación entre pestañas la maneja SAS VA, no este archivo.
  var target = document.getElementById('page-'+name);
  if(!target) return;
  document.querySelectorAll('.page').forEach(function(p){ p.classList.remove('active'); });
  document.querySelectorAll('.nav-tab').forEach(function(t){ t.classList.remove('active'); });
  target.classList.add('active');
}

    var pct = (e.monto/max*100).toFixed(1);
    html += '<div class="hbar-row">'
      + '<div class="hbar-label" title="'+e.razon+'">'+e.razon+'</div>'
      + '<div class="hbar-track"><div class="hbar-fill" style="width:'+pct+'%"></div></div>'
      + '<div class="hbar-val">'+fmt.format(e.monto)+'</div>'
      + '</div>';
  });
  $('home-bar-razon').innerHTML = html;
}

function buildHomeTreemap(){
  var top3 = EMPRESAS.slice().sort(function(a,b){ return b.pct-a.pct; }).slice(0,3);
  var html = '';
  var colors = ['#d4a017','#c8960c','#b5820a'];
  top3.forEach(function(e,i){
    var w = (i===0? 100 : i===1? 66 : 50);
    html += '<div class="treemap-tile" style="width:calc('+w+'% - 4px);height:60px;background:'+colors[i]+';">'
      + e.razon + '<br><small style="font-weight:400;font-size:9px;">Pct discrepancia: '+e.pct+'%</small>'
      + '</div>';
  });
  $('home-treemap').innerHTML = html;
}

/* ══════════════════════════════════
   DISCREPANCIAS — Grouped bar
   ══════════════════════════════════ */
function buildDiscBar(){
  var maxVal = Math.max.apply(null, PERIODOS_DATA.map(function(p){ return Math.max(p.fact,p.ing); }));
  var chartH = 160;
  var html = '';
  PERIODOS_DATA.forEach(function(p){
    var hF = Math.round((p.fact/maxVal)*chartH);
    var hI = Math.round((p.ing/maxVal)*chartH);
    html += '<div class="gbar-group">'
      + '<div class="gbar green" style="height:'+hF+'px;" title="Facturación: '+fmtN.format(p.fact)+'M"></div>'
      + '<div class="gbar red"   style="height:'+hI+'px;" title="Ingresos: '+fmtN.format(p.ing)+'M"></div>'
      + '</div>';
  });
  $('disc-bar-chart').innerHTML = html;
  $('disc-bar-labels').innerHTML = PERIODOS_DATA.map(function(p){ return '<span>'+p.label+'</span>'; }).join('');
}

function buildDiscTables(){
  // Contribuyentes
  var html = '';
  EMPRESAS.forEach(function(e){
    html += '<tr><td>'+e.nit+'</td><td>'+e.razon+'</td><td>'+e.act+'</td>'
          + '<td class="amount">'+fmt.format(e.monto)+'</td></tr>';
  });
  $('tbody-contribuyentes').innerHTML = html;

  // Detalle
  html = '';
  DETALLE.forEach(function(d){
    var disc = d.fact - d.ing;
    html += '<tr><td>'+d.nit+'</td><td>'+d.razon+'</td><td>'+d.periodo+'</td>'
          + '<td>'+fmt.format(d.fact)+'</td>'
          + '<td class="amount">'+fmt.format(d.ing)+'</td>'
          + '<td class="amount" style="color:var(--green-light);">'+fmt.format(disc)+'</td></tr>';
  });
  $('tbody-detalle').innerHTML = html;
}

/* ══════════════════════════════════
   ANÁLISIS
   ══════════════════════════════════ */
function buildAnalisisBar(){
  var niveles = ['Menos atraso','Atraso medio','Mayor atraso'];
  var counts = {};
  niveles.forEach(function(n){ counts[n]=0; });
  ANALISIS_DATA.forEach(function(r){ counts[r.nivel]++; });
  var max = Math.max.apply(null, Object.values(counts));
  var html = '';
  niveles.forEach(function(n){
    var pct = (counts[n]/max*100).toFixed(0);
    html += '<div class="hbar-row">'
      + '<div class="hbar-label" style="width:100px;">'+n+'</div>'
      + '<div class="hbar-track"><div class="hbar-fill" style="width:'+pct+'%;background:#f5c842;"></div></div>'
      + '<div class="hbar-val" style="width:50px;">'+fmtN.format(counts[n])+'</div>'
      + '</div>';
  });
  $('analisis-bar').innerHTML = html;
}

function buildAnalisisTable(){
  var html = '';
  ANALISIS_DATA.forEach(function(r){
    html += '<tr>'
      + '<td>'+r.id+'</td>'
      + '<td>'+r.nivel+'</td>'
      + '<td>'+r.pot+'</td>'
      + '<td style="color:var(--navy); font-weight:700;">'+r.prop.toFixed(10)+'</td>'
      + '<td style="text-align:center;">'+r.dias+'</td>'
      + '<td style="text-align:center;">'+r.hist+'</td>'
      + '</tr>';
  });
  $('analisis-table').innerHTML = html;
}

/* ══════════════════════════════════
   ZONIFICACIÓN
   ══════════════════════════════════ */
function buildZonBar(){
  var data = MUNICIPIOS_ZON.slice(0, 12);
  var max = data[0].n;
  var html = '';
  data.forEach(function(m){
    var pct = (m.n/max*100).toFixed(0);
    html += '<div class="hbar-row" style="margin-bottom:5px;">'
      + '<div class="hbar-label" style="width:140px;font-size:10px;">'+m.mun+'</div>'
      + '<div class="hbar-track" style="height:16px;"><div class="hbar-fill" style="width:'+pct+'%;"></div></div>'
      + '<div class="hbar-val" style="width:40px;">'+fmtN.format(m.n)+'</div>'
      + '</div>';
  });
  $('zon-bar').innerHTML = html;
}

function buildZonTables(){
  var html = '';
  ZON_TABLE.forEach(function(r){
    var row = '<tr><td>'+r.nit+'</td><td>'+r.razon+'</td><td>'+r.tam+'</td>'
            + '<td>'+r.mun+'</td><td>'+r.ciudad+'</td><td>'+r.dir+'</td>'
            + '<td class="amount">'+fmt.format(r.monto)+'</td></tr>';
    html += row;
  });
  $('zon-tbody-isr').innerHTML = html;
  $('zon-tbody-aduanas').innerHTML = html;
  $('zon-tbody-iva').innerHTML = html;
}

/* ══════════════════════════════════
   INTERACTIVITY
   ══════════════════════════════════ */
function switchStab(el, targetId){
  var parent = el.closest('.card') || el.parentElement.parentElement;
  parent.querySelectorAll('.stab').forEach(function(s){ s.classList.remove('active'); });
  el.classList.add('active');
  // hide siblings
  var container = el.closest('.card');
  var allTabs = container ? container.querySelectorAll('[id]') : [];
  allTabs.forEach(function(t){ t.style.display='none'; });
  $(targetId).style.display='';
}

function togglePill(el, label){
  el.classList.toggle('active');
}

function toggleBtnBar(el, bbId){
  var bb = $(bbId);
  bb.querySelectorAll('.btn-tag').forEach(function(b){ b.classList.remove('active'); });
  el.classList.add('active');
}

function applyFilters(){
  var razon = $('f-razon').value.toLowerCase();
  var nit   = $('f-nit').value.toLowerCase();
  var rows = $('tbody-contribuyentes').querySelectorAll('tr');
  rows.forEach(function(r){
    var tds = r.querySelectorAll('td');
    var matchR = !razon || tds[1].textContent.toLowerCase().includes(razon);
    var matchN = !nit   || tds[0].textContent.toLowerCase().includes(nit);
    r.style.display = (matchR && matchN) ? '' : 'none';
  });
}

/* ══════════════════════════════════
   INIT
   ══════════════════════════════════ */
(function init(){
  function safe(fn){ try { fn(); } catch(e){ /* elemento no presente en esta pestaña */ } }
  if (document.getElementById('home-bar-razon'))   safe(buildHomeBar);
  if (document.getElementById('home-treemap'))     safe(buildHomeTreemap);
  if (document.getElementById('disc-bar-chart'))   safe(buildDiscBar);
  if (document.getElementById('tbody-contribuyentes')) safe(buildDiscTables);
  if (document.getElementById('analisis-bar'))     safe(buildAnalisisBar);
  if (document.getElementById('analisis-table'))   safe(buildAnalisisTable);
  if (document.getElementById('zon-bar'))          safe(buildZonBar);
  if (document.getElementById('zon-tbody-isr'))    safe(buildZonTables);
})();
</script>
</body>
</html>
