<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>KPIs - Zonificación</title>

<style>
.gob005-kpis-zona {
  --g5-blue-950:#081F3D; --g5-blue-900:#0B2E59; --g5-blue-800:#144A7A; --g5-blue-700:#1D629D;
  --g5-blue-500:#2F80C3; --g5-blue-100:#EAF4FB;
  --g5-surface:#FFFFFF; --g5-border:#D6E2ED; --g5-muted:#66788A; --g5-danger:#C84A4A;
  --g5-c-decl:var(--g5-blue-900); --g5-c-min:var(--g5-blue-700); --g5-c-imss:var(--g5-blue-500);
  --g5-c-decl-2:#DCECF7; --g5-c-min-2:#EAF4FB; --g5-c-imss-2:#D9EDF9; --g5-neg-2:#F8EAEA;
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; padding: 10px; font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Roboto,Arial,sans-serif; background: #fff; height: 100vh; }
.gob005-kpis-zona { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; height: 100%; }
.gob005-kpis-zona__error { grid-column: 1 / -1; color: #b91c1c; font-size: 11px; display: none; white-space: pre-wrap; margin-bottom: 4px; }
.g5-kpi { position: relative; overflow: hidden; background: var(--g5-surface); border: 1px solid var(--g5-border); border-radius: 12px;
  box-shadow: 0 1px 2px rgba(8,31,61,.04), 0 4px 14px rgba(8,31,61,.055); padding: 12px 14px 12px 18px; display: flex; flex-direction: column; justify-content: center; }
.g5-kpi .accent { position: absolute; left: 0; top: 0; bottom: 0; width: 4px; }
.g5-kpi.amber .accent { background: var(--g5-c-min); }
.g5-kpi.blue .accent { background: var(--g5-c-decl); }
.g5-kpi.green .accent { background: var(--g5-c-imss); }
.g5-kpi.red .accent { background: var(--g5-danger); }
.g5-kpi .k-ic { position: absolute; top: 11px; right: 12px; width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; }
.g5-kpi.amber .k-ic { background: var(--g5-c-min-2); color: var(--g5-c-min); }
.g5-kpi.blue .k-ic { background: var(--g5-c-decl-2); color: var(--g5-c-decl); }
.g5-kpi.green .k-ic { background: var(--g5-c-imss-2); color: var(--g5-c-imss); }
.g5-kpi.red .k-ic { background: var(--g5-neg-2); color: var(--g5-danger); }
.g5-kpi .k-ic svg { width: 17px; height: 17px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.g5-kpi .k-lbl { font-size: 12.5px; color: var(--g5-muted); font-weight: 700; padding-right: 34px; min-height: 2.3em; display: flex; align-items: flex-start; line-height: 1.25; }
.g5-kpi .k-val { font-size: clamp(22px,2vw,30px); font-weight: 900; letter-spacing: -.5px; margin: 4px 0 1px; font-variant-numeric: tabular-nums; color: var(--g5-blue-900); }
.g5-kpi.red .k-val { color: var(--g5-danger); }
.g5-kpi .k-foot { font-size: 11.5px; color: #8AA0B4; }
@media (max-width: 760px) { .gob005-kpis-zona { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>

<div class="gob005-kpis-zona">
  <div class="gob005-kpis-zona__error" id="error"></div>

  <div class="g5-kpi amber">
    <div class="accent"></div>
    <div class="k-ic"><svg viewBox="0 0 24 24"><path d="M18 5H7l6 7-6 7h11"/></svg></div>
    <div class="k-lbl">Total de discrepancias</div>
    <div class="k-val" id="v0">—</div>
    <div class="k-foot">suma territorial</div>
  </div>

  <div class="g5-kpi blue">
    <div class="accent"></div>
    <div class="k-ic"><svg viewBox="0 0 24 24"><path d="M4 19h16"/><path d="M7 16V9"/><path d="M12 16V5"/><path d="M17 16v-4"/></svg></div>
    <div class="k-lbl">Debajo del mínimo</div>
    <div class="k-val" id="v1">—</div>
    <div class="k-foot">regla: mínimo legal</div>
  </div>

  <div class="g5-kpi green">
    <div class="accent"></div>
    <div class="k-ic"><svg viewBox="0 0 24 24"><path d="M4 4h7v7H4z"/><path d="M13 4h7v7h-7z"/><path d="M4 13h7v7H4z"/><path d="M13 13h7v7h-7z"/></svg></div>
    <div class="k-lbl">Debajo del estimado IMSS</div>
    <div class="k-val" id="v2">—</div>
    <div class="k-foot">regla: SDI IMSS</div>
  </div>

  <div class="g5-kpi red">
    <div class="accent"></div>
    <div class="k-ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v5"/><path d="M12 16h.01"/></svg></div>
    <div class="k-lbl">Fuera del padrón</div>
    <div class="k-val" id="v3">—</div>
    <div class="k-foot">sin registro patronal</div>
  </div>
</div>

<script>
/* ===== DATOS: mismo mapeo del tablero completo gob-005, fuente: ZONIFICACION ===== */
var MAP_ZONIF = {
  disc_min: ["discrepancia vs minimo", "discrepancia min pos", "disc vs isn minimo", "discrepancia min"],
  disc_imss: ["discrepancia vs imss", "discrepancia imss pos", "disc vs isn imss", "discrepancia imss"],
  regla_id: ["regla id", "regla_id"], regla: ["regla rota", "regla txt"]
};
function normalize(s) { return String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[\s._]+/g, " ").trim(); }
function buildColIndex(columns, amap) {
  var idx = {};
  Object.keys(amap).forEach(function(f) {
    for (var i = 0; i < columns.length; i++) {
      var lbl = normalize(columns[i].label || columns[i].name || "");
      if (amap[f].some(function(a) { var n = normalize(a); return lbl === n || lbl.includes(n); })) { idx[f] = i; break; }
    }
  });
  return idx;
}
var toNum = function(v) { if (v == null || v === "") return undefined; var n = +String(v).replace(/[^0-9.\-]/g, ""); return isNaN(n) ? undefined : n; };

function zonifFromVA(msg) {
  var cols = msg.columns || [], data = msg.data || [], idx = buildColIndex(cols, MAP_ZONIF);
  var g = function(row, f) { return idx[f] != null ? row[idx[f]] : undefined; };
  return data.map(function(row) {
    var rid = String(g(row, "regla_id") || "");
    var regla = g(row, "regla") || rid;
    var fuera = /fuera/i.test(rid + " " + regla) ? 1 : 0;
    return { disc_min: toNum(g(row, "disc_min")) || 0, disc_imss: toNum(g(row, "disc_imss")) || 0, regla: regla, fuera_padron: fuera };
  });
}
function fmtMXN(v) {
  if (v == null || isNaN(v)) return "—";
  var a = Math.abs(v);
  if (a >= 1e9) return "$" + (v / 1e9).toFixed(2) + " MMM";
  if (a >= 1e6) return "$" + (v / 1e6).toFixed(2) + " M";
  if (a >= 1e3) return "$" + (v / 1e3).toFixed(1) + " K";
  return "$" + Math.round(v).toLocaleString("es-MX");
}
function fmtNum(v) { return v == null || isNaN(v) ? "—" : Math.round(v).toLocaleString("es-MX"); }
function sum(arr, f) { return arr.reduce(function(s, x) { return s + (+f(x) || 0); }, 0); }

function render(z) {
  var isMin = function(x) { return /min/i.test(x.regla || "") && !x.fuera_padron; };
  var isImss = function(x) { return /imss/i.test(x.regla || "") && !x.fuera_padron; };
  var rMin = z.filter(isMin), rImss = z.filter(isImss), rFuera = z.filter(function(x) { return x.fuera_padron; });
  var totDisc = sum(z, function(x) { return x.disc_min + x.disc_imss; });
  document.getElementById("v0").textContent = fmtMXN(totDisc);
  document.getElementById("v1").textContent = fmtMXN(sum(rMin, function(x) { return x.disc_min; }));
  document.getElementById("v2").textContent = fmtMXN(sum(rImss, function(x) { return x.disc_imss; }));
  document.getElementById("v3").textContent = fmtNum(rFuera.length);
}

window.addEventListener('message', function(evt) {
  var m = evt.data || {};
  if (!m || typeof m !== 'object' || !Array.isArray(m.columns) || !Array.isArray(m.data)) return;
  try {
    render(zonifFromVA(m));
    document.getElementById('error').style.display = 'none';
  } catch (e) {
    document.getElementById('error').textContent = e.message;
    document.getElementById('error').style.display = 'block';
  }
});

try { if (window.parent) window.parent.postMessage({ type: 'ready', object: 'gob-005-zona-kpis' }, '*'); } catch (e) {}

/* Valores de muestra para previsualización standalone (sin conexión a VA) */
document.getElementById('v0').textContent = '$792,450 M';
document.getElementById('v1').textContent = '$335,976 M';
document.getElementById('v2').textContent = '$412,318 M';
document.getElementById('v3').textContent = '170';
</script>

</body>
</html>
