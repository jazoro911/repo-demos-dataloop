<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Ranking - Contribuyentes prioritarios (Inicio)</title>

<style>
.gob005-ranking-contribuyentes {
  --g5-blue-950:#081F3D; --g5-blue-900:#0B2E59; --g5-blue-800:#144A7A; --g5-blue-700:#1D629D;
  --g5-blue-500:#2F80C3; --g5-blue-300:#8DC2E8; --g5-blue-100:#EAF4FB;
  --g5-surface:#FFFFFF; --g5-border:#D6E2ED; --g5-muted:#66788A;
}

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  padding: 14px 16px;
  font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Roboto,Arial,sans-serif;
  background: var(--g5-surface);
  height: 100vh;
  font-size: 13px;
}

.gob005-ranking-contribuyentes {
  height: 100%;
  display: flex;
  flex-direction: column;
}

.gob005-ranking-contribuyentes__title { font-size: 15px; font-weight: 800; color: var(--g5-blue-950); margin: 0 0 1px; }
.gob005-ranking-contribuyentes__sub { color: var(--g5-muted); font-size: 11.5px; margin-bottom: 10px; }

.gob005-ranking-contribuyentes__error { color: #b91c1c; font-size: 11px; display: none; white-space: pre-wrap; margin-bottom: 6px; }

.rank {
  flex: 1 1 0; min-height: 0; overflow-y: auto; overflow-x: hidden;
  display: flex; flex-direction: column; gap: 8px; padding: 0 3px 8px 0;
  scrollbar-width: thin; scrollbar-color: var(--g5-blue-300) var(--g5-blue-100);
}
.rank::-webkit-scrollbar { width: 7px; }
.rank::-webkit-scrollbar-track { background: var(--g5-blue-100); border-radius: 999px; }
.rank::-webkit-scrollbar-thumb { background: var(--g5-blue-300); border-radius: 999px; }

.priority-row {
  display: grid; grid-template-columns: 24px minmax(0,1fr) minmax(82px,auto);
  grid-template-rows: auto 7px; gap: 4px 10px; align-items: center; flex: 0 0 auto; min-height: 40px;
}
.priority-row .idx {
  width: 22px; height: 22px; border-radius: 7px; background: var(--g5-blue-100); color: var(--g5-blue-800);
  display: grid; place-items: center; font-size: 11px; font-weight: 900;
}
.priority-name {
  min-width: 0; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden;
  font-size: 12.5px; font-weight: 750; line-height: 1.12; color: var(--g5-blue-950);
}
.priority-value { font-size: 12px; font-weight: 800; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; color: var(--g5-blue-900); }
.priority-track { grid-column: 2 / 4; height: 7px; border-radius: 4px; background: var(--g5-blue-100); overflow: hidden; }
.priority-track i { display: block; height: 100%; border-radius: 4px; }

.callout { color: var(--g5-muted); font-size: 12px; text-align: center; padding: 20px 0; }
</style>
</head>
<body>

<div class="gob005-ranking-contribuyentes">
  <div class="gob005-ranking-contribuyentes__title">Contribuyentes prioritarios</div>
  <div class="gob005-ranking-contribuyentes__sub">Suma vs. mínimo + vs. IMSS</div>
  <div class="gob005-ranking-contribuyentes__error" id="error"></div>
  <div class="rank" id="rank"></div>
</div>

<script>
/* ===== DATOS: campo interno -> posibles etiquetas/nombres de columna que manda SAS VA =====
   Mismo mapeo que usa el tablero completo gob-005 (fuente: CONCILIACION_EMPRESA_PERIODO_V2) */
var MAP_DETAIL = {
  rfc:       ["rfc"],
  razon:     ["razon social", "razon", "razón"],
  disc_min:  ["disc vs isn minimo", "discrepancia vs minimo", "disc vs minimo"],
  disc_imss: ["disc vs isn imss", "discrepancia vs imss"]
};

function normalize(s) {
  return String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[\s._]+/g, " ").trim();
}
function buildColIndex(columns, amap) {
  var idx = {};
  Object.keys(amap).forEach(function(f) {
    for (var i = 0; i < columns.length; i++) {
      var lbl = normalize(columns[i].label || columns[i].name || "");
      if (amap[f].some(function(a) { var n = normalize(a); return lbl === n || lbl.includes(n); })) { idx[f] = i; break; }
    }
  });
  return idx;
}
var toNum = function(v) { if (v == null || v === "") return undefined; var n = +String(v).replace(/[^0-9.\-]/g, ""); return isNaN(n) ? undefined : n; };

function fmtMXN(v) {
  if (v == null || isNaN(v)) return "—";
  var a = Math.abs(v);
  if (a >= 1e9) return "$" + (v / 1e9).toFixed(2) + " MMM";
  if (a >= 1e6) return "$" + (v / 1e6).toFixed(2) + " M";
  if (a >= 1e3) return "$" + (v / 1e3).toFixed(1) + " K";
  return "$" + Math.round(v).toLocaleString("es-MX");
}
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function(c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

function detailFromVA(msg) {
  var cols = msg.columns || [], data = msg.data || [], idx = buildColIndex(cols, MAP_DETAIL);
  var g = function(row, f) { return idx[f] != null ? row[idx[f]] : undefined; };
  return data.map(function(row) {
    return { rfc: g(row, "rfc"), razon: g(row, "razon"), disc_min: toNum(g(row, "disc_min")) || 0, disc_imss: toNum(g(row, "disc_imss")) || 0 };
  });
}

/* Agrega por contribuyente (RFC/razón social) y ordena por (disc_min + disc_imss) descendente */
function contribAgg(rows) {
  var m = new Map();
  rows.forEach(function(r) {
    var k = r.rfc || r.razon; if (!k) return;
    if (!m.has(k)) m.set(k, { rfc: r.rfc, razon: r.razon, disc_min: 0, disc_imss: 0 });
    var o = m.get(k);
    o.disc_min += (+r.disc_min || 0);
    o.disc_imss += (+r.disc_imss || 0);
  });
  return Array.from(m.values());
}

function renderRank(items) {
  var host = document.getElementById("rank");
  items = items.slice(0, 10);
  if (!items.length) { host.innerHTML = '<div class="callout">Sin datos.</div>'; return; }
  var max = Math.max(1, Math.max.apply(null, items.map(function(i) { return i.val; })));
  var pal = ["#0B2E59", "#2F80C3", "#1D629D", "#2F80C3", "#8DC2E8", "#144A7A"];
  host.innerHTML = items.map(function(it, i) {
    return '<div class="priority-row" title="' + esc(it.name) + ' · ' + esc(fmtMXN(it.val)) + '">' +
      '<div class="idx">' + (i + 1) + '</div>' +
      '<div class="priority-name">' + esc(it.name) + '</div>' +
      '<div class="priority-value">' + fmtMXN(it.val) + '</div>' +
      '<div class="priority-track"><i style="width:' + (it.val / max * 100).toFixed(1) + '%;background:' + pal[i % pal.length] + '"></i></div>' +
    '</div>';
  }).join("");
}

function render(rows) {
  var agg = contribAgg(rows).map(function(c) { return { name: c.razon, val: c.disc_min + c.disc_imss }; })
    .sort(function(a, b) { return b.val - a.val; });
  renderRank(agg);
}

window.addEventListener('message', function(evt) {
  var m = evt.data || {};
  if (!m || typeof m !== 'object' || !Array.isArray(m.columns) || !Array.isArray(m.data)) return;
  try {
    render(detailFromVA(m));
    document.getElementById('error').style.display = 'none';
  } catch (e) {
    document.getElementById('error').textContent = e.message;
    document.getElementById('error').style.display = 'block';
  }
});

try {
  if (window.parent) window.parent.postMessage({ type: 'ready', object: 'gob-005-ranking-contribuyentes' }, '*');
} catch (e) {}

/* Datos de muestra para previsualización standalone (sin conexión a VA) */
renderRank([
  { name: "MADERAS DEL GUADIANA SA DE CV", val: 612000 },
  { name: "MINERA CERRO DEL MERCADO SA", val: 548000 },
  { name: "EMBOTELLADORA LAGUNA SA", val: 431000 },
  { name: "ALIMENTOS PROCESADOS DGO", val: 397000 },
  { name: "CONSTRUCTORA VICTORIA DE DGO", val: 322000 },
  { name: "TRANSPORTES LERDO SA DE CV", val: 275000 },
  { name: "AUTOPARTES DEL GUADIANA SA", val: 231000 },
  { name: "ACEROS DE LERDO SA DE CV", val: 198000 },
  { name: "FARMACIAS DEL GUADIANA SA", val: 164000 },
  { name: "AGROINDUSTRIAS NAZAS SPR", val: 129000 }
]);
</script>

</body>
</html>
