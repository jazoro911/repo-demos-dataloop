<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Contribuyentes con mayor plantilla no declarada</title>

<style>
.gob005-emp-tree {
  --g5-blue-950:#081F3D; --g5-blue-900:#0B2E59; --g5-blue-700:#1D629D; --g5-blue-100:#EAF4FB;
  --g5-surface:#FFFFFF; --g5-border:#D6E2ED; --g5-muted:#66788A;
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; padding: 14px 16px; font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Roboto,Arial,sans-serif; background: var(--g5-surface); height: 100vh; font-size: 13px; }
.gob005-emp-tree { height: 100%; display: flex; flex-direction: column; }
.gob005-emp-tree__title { font-size: 15px; font-weight: 800; color: var(--g5-blue-950); margin: 0 0 1px; }
.gob005-emp-tree__sub { color: var(--g5-muted); font-size: 11.5px; margin-bottom: 12px; }
.gob005-emp-tree__error { color: #b91c1c; font-size: 11px; display: none; white-space: pre-wrap; margin-bottom: 6px; }
.gob005-emp-tree__body { flex: 1 1 0; min-height: 0; }

.employee-gap-list { height: 100%; min-height: 0; display: flex; flex-direction: column; justify-content: space-around; gap: 8px; overflow: hidden; }
.employee-gap-row { display: grid; grid-template-columns: minmax(0,42%) minmax(0,37%) minmax(110px,21%); gap: 10px; align-items: center; min-height: 0; }
.employee-gap-name { font-size: 12px; font-weight: 750; line-height: 1.12; color: var(--g5-blue-950); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; white-space: normal; overflow: hidden; }
.employee-gap-track { height: 12px; border-radius: 999px; background: var(--g5-blue-100); overflow: hidden; border: 1px solid var(--g5-border); }
.employee-gap-track i { display: block; height: 100%; border-radius: 999px; background: var(--g5-blue-700); }
.employee-gap-value { text-align: right; font-size: 11.5px; font-weight: 900; color: var(--g5-blue-900); font-variant-numeric: tabular-nums; white-space: nowrap; }
.callout { color: var(--g5-muted); font-size: 12px; text-align: center; padding: 20px 0; }
</style>
</head>
<body>

<div class="gob005-emp-tree">
  <div class="gob005-emp-tree__title">Contribuyentes con mayor plantilla no declarada</div>
  <div class="gob005-emp-tree__sub">Empleados registrados en IMSS no declarados</div>
  <div class="gob005-emp-tree__error" id="error"></div>
  <div class="gob005-emp-tree__body" id="body"></div>
</div>

<script>
/* ===== DATOS: mismo mapeo del tablero completo gob-005, fuente: CONCILIACION_EMPRESA_PERIODO_V2 ===== */
var MAP_DETAIL = {
  rfc: ["rfc"], razon: ["razon social", "razon", "razón"],
  emp_decl: ["num empleados declarados", "numero empleados decl", "empleados declarados"],
  emp_imss: ["num empleados en el imss", "empleados en el imss", "empleados imss"]
};
function normalize(s) { return String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[\s._]+/g, " ").trim(); }
function buildColIndex(columns, amap) {
  var idx = {};
  Object.keys(amap).forEach(function(f) {
    for (var i = 0; i < columns.length; i++) {
      var lbl = normalize(columns[i].label || columns[i].name || "");
      if (amap[f].some(function(a) { var n = normalize(a); return lbl === n || lbl.includes(n); })) { idx[f] = i; break; }
    }
  });
  return idx;
}
var toNum = function(v) { if (v == null || v === "") return undefined; var n = +String(v).replace(/[^0-9.\-]/g, ""); return isNaN(n) ? undefined : n; };
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function(c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
function fmtNum(v) { return v == null || isNaN(v) ? "—" : Math.round(v).toLocaleString("es-MX"); }

function detailFromVA(msg) {
  var cols = msg.columns || [], data = msg.data || [], idx = buildColIndex(cols, MAP_DETAIL);
  var g = function(row, f) { return idx[f] != null ? row[idx[f]] : undefined; };
  return data.map(function(row) { return { rfc: g(row, "rfc"), razon: g(row, "razon"), emp_decl: toNum(g(row, "emp_decl")) || 0, emp_imss: toNum(g(row, "emp_imss")) || 0 }; });
}

function contribAgg(rows) {
  var m = new Map();
  rows.forEach(function(r) {
    var k = r.rfc || r.razon; if (!k) return;
    if (!m.has(k)) m.set(k, { razon: r.razon, emp_decl: 0, emp_imss: 0 });
    var o = m.get(k); o.emp_decl += (+r.emp_decl || 0); o.emp_imss += (+r.emp_imss || 0);
  });
  return Array.from(m.values());
}

function employeeGapBars(host, items) {
  items = items.map(function(i) { return Object.assign({}, i, { gap: Math.max((+i.emp_imss || 0) - (+i.emp_decl || 0), 0) }); })
    .filter(function(i) { return i.gap > 0; }).sort(function(a, b) { return b.gap - a.gap; }).slice(0, 6);
  if (!items.length) { host.innerHTML = '<div class="callout">Sin datos.</div>'; return; }
  var maxV = Math.max.apply(null, items.map(function(i) { return i.gap; }));
  host.innerHTML = '<div class="employee-gap-list">' + items.map(function(it) {
    var pct = it.emp_imss ? it.gap / it.emp_imss * 100 : 0;
    return '<div class="employee-gap-row" title="' + esc(it.razon) + ' · Declarados: ' + fmtNum(it.emp_decl) + ' · IMSS: ' + fmtNum(it.emp_imss) + ' · No declarados: ' + fmtNum(it.gap) + ' · ' + pct.toFixed(1) + '%">' +
      '<div class="employee-gap-name">' + esc(it.razon) + '</div>' +
      '<div class="employee-gap-track"><i style="width:' + (it.gap / maxV * 100).toFixed(1) + '%"></i></div>' +
      '<div class="employee-gap-value">' + fmtNum(it.gap) + ' no declarados</div>' +
    '</div>';
  }).join("") + '</div>';
}

window.addEventListener('message', function(evt) {
  var m = evt.data || {};
  if (!m || typeof m !== 'object' || !Array.isArray(m.columns) || !Array.isArray(m.data)) return;
  try {
    employeeGapBars(document.getElementById('body'), contribAgg(detailFromVA(m)));
    document.getElementById('error').style.display = 'none';
  } catch (e) {
    document.getElementById('error').textContent = e.message;
    document.getElementById('error').style.display = 'block';
  }
});

try { if (window.parent) window.parent.postMessage({ type: 'ready', object: 'gob-005-emp-tree' }, '*'); } catch (e) {}

/* Datos de muestra para previsualización standalone (sin conexión a VA) */
employeeGapBars(document.getElementById('body'), [
  { razon: "MINERA CERRO DEL MERCADO SA", emp_decl: 120, emp_imss: 440 },
  { razon: "MADERAS DEL GUADIANA SA DE CV", emp_decl: 95, emp_imss: 380 },
  { razon: "EMBOTELLADORA LAGUNA SA", emp_decl: 210, emp_imss: 520 },
  { razon: "CONSTRUCTORA VICTORIA DE DGO", emp_decl: 60, emp_imss: 260 },
  { razon: "TRANSPORTES LERDO SA DE CV", emp_decl: 40, emp_imss: 180 },
  { razon: "AUTOPARTES DEL GUADIANA SA", emp_decl: 75, emp_imss: 210 }
]);
</script>

</body>
</html>
