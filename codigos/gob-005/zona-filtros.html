<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Filtros - Zonificación</title>

<style>
.gob005-zona-filtros {
  --g5-blue-950:#081F3D; --g5-blue-900:#0B2E59; --g5-blue-800:#144A7A; --g5-blue-700:#1D629D;
  --g5-blue-100:#EAF4FB; --g5-surface:#FFFFFF; --g5-border:#D6E2ED; --g5-muted:#66788A; --g5-input-bg:#F6FAFD;
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; padding: 9px 12px; font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Roboto,Arial,sans-serif; background: var(--g5-surface); font-size: 12.5px; }
.gob005-zona-filtros { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--g5-surface); border: 1px solid var(--g5-border); border-radius: 10px; padding: 9px 12px; }
.gob005-zona-filtros .fl-lbl { font-size: 10.5px; font-weight: 700; color: #8AA0B4; letter-spacing: .5px; text-transform: uppercase; }
.gob005-zona-filtros select, .gob005-zona-filtros input { font-family: inherit; font-size: 12.5px; color: #172536; background: var(--g5-input-bg); border: 1px solid var(--g5-border); border-radius: 7px; padding: 6px 9px; min-width: 108px; }
.gob005-zona-filtros input[type="search"] { min-width: 190px; }
.gob005-zona-filtros select:focus, .gob005-zona-filtros input:focus { outline: none; border-color: var(--g5-blue-700); }
.gob005-zona-filtros .chip { margin-left: auto; font-size: 11.5px; color: var(--g5-blue-800); font-weight: 800; background: var(--g5-blue-100); border: 1px solid var(--g5-border); border-radius: 999px; padding: 5px 10px; white-space: nowrap; }
.gob005-zona-filtros .chip.periodo { margin-left: 0; }
.gob005-zona-filtros .btn-clear { border: 1px solid var(--g5-border); background: var(--g5-input-bg); color: var(--g5-blue-950); border-radius: 7px; padding: 6px 11px; font-size: 12px; font-weight: 600; cursor: pointer; }
.gob005-zona-filtros .btn-clear:hover { background: var(--g5-blue-100); }
</style>
</head>
<body>

<div class="gob005-zona-filtros">
  <span class="fl-lbl">Filtros</span>
  <span class="chip periodo">Periodo analizado · Oct–Dic 2025</span>
  <input type="search" id="q" placeholder="Buscar razón social o RFC…" />
  <select id="municipio"><option value="">Municipio: Todos</option></select>
  <select id="zona"><option value="">Zona: Todos</option></select>
  <select id="tamano"><option value="">Tamaño: Todos</option></select>
  <select id="regla"><option value="">Regla rota: Todos</option></select>
  <button class="btn-clear" id="clear">Limpiar</button>
  <span class="chip" id="chip">— de — registros</span>
</div>

<script>
/* ===== DATOS: mismo mapeo del tablero completo gob-005, fuente: ZONIFICACION ===== */
var MAP_ZONIF = {
  rfc: ["rfc"], razon: ["razon social", "razon", "razón"],
  municipio: ["municipio"], zona: ["zona"], tamano: ["clasificacion del inegi", "clasificacion", "tamano", "tamaño", "estrato"],
  regla_id: ["regla id", "regla_id"], regla: ["regla rota", "regla txt"]
};
function normalize(s) { return String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[\s._]+/g, " ").trim(); }
function buildColIndex(columns, amap) {
  var idx = {};
  Object.keys(amap).forEach(function(f) {
    for (var i = 0; i < columns.length; i++) {
      var lbl = normalize(columns[i].label || columns[i].name || "");
      if (amap[f].some(function(a) { var n = normalize(a); return lbl === n || lbl.includes(n); })) { idx[f] = i; break; }
    }
  });
  return idx;
}
function zonifFromVA(msg) {
  var cols = msg.columns || [], data = msg.data || [], idx = buildColIndex(cols, MAP_ZONIF);
  var g = function(row, f) { return idx[f] != null ? row[idx[f]] : undefined; };
  return data.map(function(row) {
    var rid = String(g(row, "regla_id") || ""), reglaTxt = g(row, "regla") || rid;
    return { rfc: g(row, "rfc"), razon: g(row, "razon"), municipio: g(row, "municipio"), zona: g(row, "zona"), tamano: g(row, "tamano"), regla: reglaTxt };
  });
}
function uniq(a) { var seen = {}, out = []; a.forEach(function(v) { if (v != null && v !== "" && !seen[v]) { seen[v] = 1; out.push(v); } }); return out.sort(); }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function(c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
function fmtNum(v) { return v == null || isNaN(v) ? "—" : Math.round(v).toLocaleString("es-MX"); }

var ALL = [];
var state = { municipio: "", zona: "", tamano: "", regla: "", q: "" };
var FIELDS = ["municipio", "zona", "tamano", "regla"];

/* IMPORTANTE: este panel filtra su propia copia de los datos y actualiza su contador local.
   Para que el filtro afecte también al KPI/gráfica/tabla de esta misma página, hay que enlazarlos
   en SAS VA (acciones/filtros de reporte); este objeto solo emite el estado vía postMessage. */
function applyAndCount() {
  var q = state.q.toLowerCase().trim();
  var out = ALL.filter(function(r) {
    for (var i = 0; i < FIELDS.length; i++) { var f = FIELDS[i]; if (state[f] && String(r[f]) !== state[f]) return false; }
    if (q && ((r.razon || "") + " " + (r.rfc || "")).toLowerCase().indexOf(q) < 0) return false;
    return true;
  });
  document.getElementById("chip").textContent = fmtNum(out.length) + " de " + fmtNum(ALL.length) + " registros";
  return out;
}
function emit() {
  var m = { type: "filters-applied", scope: "zona", municipio: state.municipio || undefined, zona: state.zona || undefined, tamano: state.tamano || undefined, regla: state.regla || undefined, q: state.q || undefined };
  try { if (window.parent) window.parent.postMessage(m, "*"); } catch (e) {}
}
function renderOptions() {
  FIELDS.forEach(function(f) {
    var sel = document.getElementById(f);
    var vals = uniq(ALL.map(function(r) { return r[f]; }));
    var label = f === "municipio" ? "Municipio" : f === "zona" ? "Zona" : f === "tamano" ? "Tamaño" : "Regla rota";
    sel.innerHTML = '<option value="">' + label + ': Todos</option>' + vals.map(function(v) { return '<option>' + esc(v) + '</option>'; }).join("");
    sel.value = state[f];
  });
}

document.getElementById("q").addEventListener("input", function(e) { state.q = e.target.value || ""; applyAndCount(); emit(); });
FIELDS.forEach(function(f) { document.getElementById(f).addEventListener("change", function(e) { state[f] = e.target.value || ""; applyAndCount(); emit(); }); });
document.getElementById("clear").addEventListener("click", function() {
  state = { municipio: "", zona: "", tamano: "", regla: "", q: "" };
  document.getElementById("q").value = ""; FIELDS.forEach(function(f) { document.getElementById(f).value = ""; });
  applyAndCount(); emit();
});

window.addEventListener('message', function(evt) {
  var m = evt.data || {};
  if (!m || typeof m !== 'object' || !Array.isArray(m.columns) || !Array.isArray(m.data)) return;
  try { ALL = zonifFromVA(m); renderOptions(); applyAndCount(); } catch (e) {}
});

try { if (window.parent) window.parent.postMessage({ type: 'ready', object: 'gob-005-zona-filtros' }, '*'); } catch (e) {}

/* Datos de muestra para previsualización standalone (sin conexión a VA) */
ALL = [
  { rfc: "MDG980412AB1", razon: "MADERAS DEL GUADIANA SA DE CV", municipio: "Durango", zona: "Centro", tamano: "Grande", regla: "Debajo del mínimo" },
  { rfc: "MCM010203C45", razon: "MINERA CERRO DEL MERCADO SA", municipio: "Durango", zona: "Norte", tamano: "Grande", regla: "Fuera del padrón IMSS" }
];
renderOptions();
applyAndCount();
</script>

</body>
</html>
