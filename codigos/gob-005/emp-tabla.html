<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Tabla - Empleados</title>

<style>
.gob005-tabla-emp {
  --g5-blue-950:#081F3D; --g5-blue-900:#0B2E59; --g5-blue-700:#1D629D; --g5-blue-100:#EAF4FB;
  --g5-surface:#FFFFFF; --g5-border:#D6E2ED; --g5-muted:#66788A; --g5-line-2:#E4EDF4;
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; padding: 14px 16px; font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Roboto,Arial,sans-serif; background: var(--g5-surface); height: 100vh; font-size: 12.5px; }
.gob005-tabla-emp { height: 100%; display: flex; flex-direction: column; }
.gob005-tabla-emp__error { color: #b91c1c; font-size: 11px; display: none; white-space: pre-wrap; margin-bottom: 6px; }
.tabs { display: flex; gap: 4px; margin-bottom: 8px; flex: 0 0 auto; }
.tab { font-size: 11.5px; font-weight: 600; padding: 5px 10px; border-radius: 7px; cursor: pointer; color: var(--g5-muted); border: 1px solid transparent; }
.tab.active { background: var(--g5-blue-100); color: var(--g5-blue-700); }
.tabpane { display: none; flex: 1 1 0; min-height: 0; flex-direction: column; }
.tabpane.active { display: flex; }
.tbl-scroll { flex: 1 1 0; min-height: 0; overflow: auto; border-radius: 8px; border: 1px solid var(--g5-line-2); }
table.dt { width: 100%; border-collapse: collapse; font-size: 12.5px; table-layout: fixed; }
table.dt th, table.dt td { padding: 7px 11px; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
table.dt thead th { position: sticky; top: 0; background: var(--g5-blue-950); color: #fff; font-weight: 800; font-size: 11px; letter-spacing: .3px; text-transform: uppercase; z-index: 1; }
table.dt tbody tr { border-bottom: 1px solid var(--g5-line-2); }
table.dt tbody tr:nth-child(even) { background: #F3F7FB; }
table.dt tbody tr:hover { background: #D9EFF7; }
table.dt td.num { text-align: right; font-variant-numeric: tabular-nums; }
table.dt th:first-child, table.dt td:first-child { width: 34%; }
table.dt td.neg { color: #087FA3; font-weight: 700; }
table.dt td.strong { font-weight: 700; }
.company-name { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; white-space: normal; overflow: hidden; line-height: 1.15; }
.muted { color: var(--g5-muted); }
</style>
</head>
<body>

<div class="gob005-tabla-emp">
  <div class="gob005-tabla-emp__error" id="error"></div>
  <div class="tabs">
    <span class="tab active" data-tab="c">Total por contribuyente</span>
    <span class="tab" data-tab="d">Detalle por periodo</span>
  </div>
  <div class="tabpane active" data-pane="c" id="pane-c"></div>
  <div class="tabpane" data-pane="d" id="pane-d"></div>
</div>

<script>
/* ===== DATOS: mismo mapeo del tablero completo gob-005, fuente: CONCILIACION_EMPRESA_PERIODO_V2 ===== */
function mesNumOf(v) {
  if (v == null || v === "") return 0;
  var s = String(v).trim();
  var sep = s.indexOf("-") >= 0 ? "-" : (s.indexOf("/") >= 0 ? "/" : "");
  if (sep) { var p = s.split(sep); if (p.length >= 2 && p[0].length === 4) { var mo = parseInt(p[1], 10); if (mo >= 1 && mo <= 12) return mo; } }
  if (s.length <= 2) { var n = parseInt(s, 10); if (n >= 1 && n <= 12) return n; }
  var d = new Date(s); return isNaN(d) ? 0 : d.getMonth() + 1;
}
function periodLabelFromMonth(n) { return n === 10 ? "Octubre 2025" : n === 11 ? "Noviembre 2025" : n === 12 ? "Diciembre 2025" : "—"; }

var MAP_DETAIL = {
  rfc: ["rfc"], razon: ["razon social", "razon", "razón"],
  anio: ["ano", "anio", "ejercicio"], periodo: ["periodo inicio", "periodo"],
  emp_decl: ["num empleados declarados", "numero empleados decl", "empleados declarados"],
  emp_imss: ["num empleados en el imss", "empleados en el imss", "empleados imss"],
  disc_emp: ["discrepancia de empleados"]
};
function normalize(s) { return String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[\s._]+/g, " ").trim(); }
function buildColIndex(columns, amap) {
  var idx = {};
  Object.keys(amap).forEach(function(f) {
    for (var i = 0; i < columns.length; i++) {
      var lbl = normalize(columns[i].label || columns[i].name || "");
      if (amap[f].some(function(a) { var n = normalize(a); return lbl === n || lbl.includes(n); })) { idx[f] = i; break; }
    }
  });
  return idx;
}
var toNum = function(v) { if (v == null || v === "") return undefined; var n = +String(v).replace(/[^0-9.\-]/g, ""); return isNaN(n) ? undefined : n; };

function detailFromVA(msg) {
  var cols = msg.columns || [], data = msg.data || [], idx = buildColIndex(cols, MAP_DETAIL);
  var g = function(row, f) { return idx[f] != null ? row[idx[f]] : undefined; };
  return data.map(function(row) {
    var emp_decl = toNum(g(row, "emp_decl")) || 0, emp_imss = toNum(g(row, "emp_imss")) || 0;
    var anio = g(row, "anio") != null ? String(g(row, "anio")) : "", pini = g(row, "periodo") != null ? String(g(row, "periodo")) : "";
    var mnum = mesNumOf(pini) || mesNumOf(anio + "-" + pini);
    return {
      rfc: g(row, "rfc"), razon: g(row, "razon"), periodo: mnum ? periodLabelFromMonth(mnum) : (pini || anio),
      emp_decl: emp_decl, emp_imss: emp_imss,
      disc_emp: toNum(g(row, "disc_emp")) != null ? toNum(g(row, "disc_emp")) : Math.max(0, emp_imss - emp_decl)
    };
  });
}

function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function(c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
function fmtNum(v) { return v == null || isNaN(v) ? "—" : Math.round(v).toLocaleString("es-MX"); }

function contribAgg(rows) {
  var m = new Map();
  rows.forEach(function(r) {
    var k = r.rfc || r.razon; if (!k) return;
    if (!m.has(k)) m.set(k, { rfc: r.rfc, razon: r.razon, emp_decl: 0, emp_imss: 0, disc_emp: 0 });
    var o = m.get(k); o.emp_decl += (+r.emp_decl || 0); o.emp_imss += (+r.emp_imss || 0); o.disc_emp += (+r.disc_emp || 0);
  });
  return Array.from(m.values());
}

function tableHTML(cols, rows, max) {
  max = max || 400;
  var head = cols.map(function(c) { return '<th' + (c.num ? ' style="text-align:right"' : '') + '>' + esc(c.label) + '</th>'; }).join("");
  var body = rows.slice(0, max).map(function(r) {
    return "<tr>" + cols.map(function(c) {
      var v = c.get(r), cls = c.num ? "num" : ""; if (c.cls) cls += " " + c.cls(r);
      if (c.label === "Razón social") return '<td class="' + cls + '" title="' + esc(v) + '"><span class="company-name">' + esc(v) + '</span></td>';
      return '<td class="' + cls + '">' + esc(v) + '</td>';
    }).join("") + "</tr>";
  }).join("");
  return '<div class="tbl-scroll"><table class="dt"><thead><tr>' + head + '</tr></thead><tbody>' +
    (body || '<tr><td colspan="' + cols.length + '" class="muted" style="padding:16px">Sin registros.</td></tr>') + '</tbody></table></div>';
}

function render(d) {
  var ca = contribAgg(d).sort(function(a, b) { return b.disc_emp - a.disc_emp; });
  document.getElementById('pane-c').innerHTML = tableHTML([
    { label: "Razón social", get: function(r) { return r.razon; }, cls: function() { return "strong"; } },
    { label: "Decl.", get: function(r) { return fmtNum(r.emp_decl); }, num: true },
    { label: "IMSS", get: function(r) { return fmtNum(r.emp_imss); }, num: true },
    { label: "Disc.", get: function(r) { return fmtNum(r.disc_emp); }, num: true, cls: function() { return "neg"; } }
  ], ca);
  var det = d.slice().sort(function(a, b) { return b.disc_emp - a.disc_emp; });
  document.getElementById('pane-d').innerHTML = tableHTML([
    { label: "Razón social", get: function(r) { return r.razon; }, cls: function() { return "strong"; } },
    { label: "Periodo", get: function(r) { return r.periodo; } },
    { label: "Decl.", get: function(r) { return fmtNum(r.emp_decl); }, num: true },
    { label: "IMSS", get: function(r) { return fmtNum(r.emp_imss); }, num: true },
    { label: "Disc.", get: function(r) { return fmtNum(r.disc_emp); }, num: true, cls: function() { return "neg"; } }
  ], det);
}

document.querySelectorAll('.tab').forEach(function(tb) {
  tb.addEventListener('click', function() {
    document.querySelectorAll('.tab').forEach(function(x) { x.classList.toggle('active', x === tb); });
    document.querySelectorAll('.tabpane').forEach(function(p) { p.classList.toggle('active', p.dataset.pane === tb.dataset.tab); });
  });
});

window.addEventListener('message', function(evt) {
  var m = evt.data || {};
  if (!m || typeof m !== 'object' || !Array.isArray(m.columns) || !Array.isArray(m.data)) return;
  try {
    render(detailFromVA(m));
    document.getElementById('error').style.display = 'none';
  } catch (e) {
    document.getElementById('error').textContent = e.message;
    document.getElementById('error').style.display = 'block';
  }
});

try { if (window.parent) window.parent.postMessage({ type: 'ready', object: 'gob-005-emp-tabla' }, '*'); } catch (e) {}

/* Datos de muestra para previsualización standalone (sin conexión a VA) */
render([
  { rfc: "MDG980412AB1", razon: "MADERAS DEL GUADIANA SA DE CV", periodo: "Octubre 2025", emp_decl: 95, emp_imss: 380, disc_emp: 285 },
  { rfc: "MCM010203C45", razon: "MINERA CERRO DEL MERCADO SA", periodo: "Octubre 2025", emp_decl: 120, emp_imss: 440, disc_emp: 320 },
  { rfc: "ELA000101PL4", razon: "EMBOTELLADORA LAGUNA SA", periodo: "Noviembre 2025", emp_decl: 210, emp_imss: 520, disc_emp: 310 },
  { rfc: "CVD991110RT3", razon: "CONSTRUCTORA VICTORIA DE DGO", periodo: "Diciembre 2025", emp_decl: 60, emp_imss: 260, disc_emp: 200 },
  { rfc: "TLE950817HJ2", razon: "TRANSPORTES LERDO SA DE CV", periodo: "Octubre 2025", emp_decl: 40, emp_imss: 180, disc_emp: 140 }
]);
</script>

</body>
</html>
