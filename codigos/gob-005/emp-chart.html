<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Gráfica - Evolución de plantilla</title>

<style>
.gob005-chart-emp {
  --g5-blue-950:#081F3D; --g5-blue-900:#0B2E59; --g5-blue-500:#2F80C3; --g5-blue-100:#EAF4FB;
  --g5-surface:#FFFFFF; --g5-border:#D6E2ED; --g5-muted:#66788A; --g5-line-2:#E4EDF4;
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; padding: 14px 16px; font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Roboto,Arial,sans-serif; background: var(--g5-surface); height: 100vh; font-size: 13px; }
.gob005-chart-emp { height: 100%; display: flex; flex-direction: column; }
.gob005-chart-emp__head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
.gob005-chart-emp__title { font-size: 15px; font-weight: 800; color: var(--g5-blue-950); margin: 0 0 1px; }
.gob005-chart-emp__sub { color: var(--g5-muted); font-size: 11.5px; }
.gob005-chart-emp__error { color: #b91c1c; font-size: 11px; display: none; white-space: pre-wrap; margin-bottom: 6px; }
.gob005-chart-emp__body { flex: 1 1 0; min-height: 0; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; }
.legend .lg { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--g5-blue-950); font-weight: 600; }
.legend .sw { width: 11px; height: 11px; border-radius: 3px; }
.axis-txt { fill: var(--g5-muted); font-size: 11px; font-family: inherit; }
.grid-line { stroke: var(--g5-line-2); stroke-width: 1; }
</style>
</head>
<body>

<div class="gob005-chart-emp">
  <div class="gob005-chart-emp__head">
    <div>
      <div class="gob005-chart-emp__title">Evolución de plantilla · Oct–Dic 2025</div>
      <div class="gob005-chart-emp__sub">Declarados vs. registrados en IMSS</div>
    </div>
    <span class="legend">
      <span class="lg"><span class="sw" style="background:#0B2E59"></span>Declarados</span>
      <span class="lg"><span class="sw" style="background:#2F80C3"></span>IMSS</span>
    </span>
  </div>
  <div class="gob005-chart-emp__error" id="error"></div>
  <div class="gob005-chart-emp__body" id="chart"></div>
</div>

<script>
/* ===== DATOS: mismo mapeo del tablero completo gob-005, fuente: CONCILIACION_EMPRESA_PERIODO_V2 ===== */
var PERIOD_SCOPE = { year: "2025", months: [10, 11, 12] };
function periodLabelFromMonth(n) { return n === 10 ? "Octubre 2025" : n === 11 ? "Noviembre 2025" : n === 12 ? "Diciembre 2025" : "—"; }
function mesNumOf(v) {
  if (v == null || v === "") return 0;
  var s = String(v).trim();
  var sep = s.indexOf("-") >= 0 ? "-" : (s.indexOf("/") >= 0 ? "/" : "");
  if (sep) { var p = s.split(sep); if (p.length >= 2 && p[0].length === 4) { var mo = parseInt(p[1], 10); if (mo >= 1 && mo <= 12) return mo; } }
  if (s.length <= 2) { var n = parseInt(s, 10); if (n >= 1 && n <= 12) return n; }
  var d = new Date(s); return isNaN(d) ? 0 : d.getMonth() + 1;
}
var MAP_DETAIL = {
  anio: ["ano", "anio", "ejercicio"], periodo: ["periodo inicio", "periodo"],
  emp_decl: ["num empleados declarados", "numero empleados decl", "empleados declarados"],
  emp_imss: ["num empleados en el imss", "empleados en el imss", "empleados imss"]
};
function normalize(s) { return String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[\s._]+/g, " ").trim(); }
function buildColIndex(columns, amap) {
  var idx = {};
  Object.keys(amap).forEach(function(f) {
    for (var i = 0; i < columns.length; i++) {
      var lbl = normalize(columns[i].label || columns[i].name || "");
      if (amap[f].some(function(a) { var n = normalize(a); return lbl === n || lbl.includes(n); })) { idx[f] = i; break; }
    }
  });
  return idx;
}
var toNum = function(v) { if (v == null || v === "") return undefined; var n = +String(v).replace(/[^0-9.\-]/g, ""); return isNaN(n) ? undefined : n; };

function detailFromVA(msg) {
  var cols = msg.columns || [], data = msg.data || [], idx = buildColIndex(cols, MAP_DETAIL);
  var g = function(row, f) { return idx[f] != null ? row[idx[f]] : undefined; };
  return data.map(function(row) {
    var anio = g(row, "anio") != null ? String(g(row, "anio")) : "", pini = g(row, "periodo") != null ? String(g(row, "periodo")) : "";
    var mnum = mesNumOf(pini) || mesNumOf(anio + "-" + pini);
    return { mesNum: mnum, emp_decl: toNum(g(row, "emp_decl")) || 0, emp_imss: toNum(g(row, "emp_imss")) || 0 };
  });
}
function sum(arr, f) { return arr.reduce(function(s, x) { return s + (+f(x) || 0); }, 0); }
function fmtNum(v) { return v == null || isNaN(v) ? "—" : Math.round(v).toLocaleString("es-MX"); }

function employeeSlope(host, rows) {
  var pts = PERIOD_SCOPE.months.map(function(m) {
    var r = rows.filter(function(x) { return x.mesNum === m; });
    return { m: m, label: periodLabelFromMonth(m), short: (m === 10 ? "Oct" : m === 11 ? "Nov" : "Dic"),
      decl: sum(r, function(x) { return x.emp_decl; }), imss: sum(r, function(x) { return x.emp_imss; }) };
  });
  var W = Math.max(320, host.clientWidth || 520), H = Math.max(180, host.clientHeight || 220);
  var mL = 116, mR = 66, mT = 18, mB = 38, maxV = Math.max.apply(null, pts.map(function(p) { return Math.max(p.decl, p.imss); })) || 1;
  var plotW = W - mL - mR, X = function(i) { return mL + (pts.length <= 1 ? plotW / 2 : plotW * i / (pts.length - 1)); };
  var Y = function(v) { return mT + (H - mT - mB) - (H - mT - mB) * v / maxV; };
  var series = [{ key: "decl", name: "Declarados", color: "#0B2E59" }, { key: "imss", name: "IMSS", color: "#2F80C3" }];
  var svg = '<line class="grid-line" x1="' + mL + '" y1="' + (H - mB) + '" x2="' + (W - mR) + '" y2="' + (H - mB) + '"/>';
  series.forEach(function(s) {
    var line = pts.map(function(p, i) { return (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(p[s.key]).toFixed(1); }).join(" ");
    svg += '<path d="' + line + '" fill="none" stroke="' + s.color + '" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>';
    pts.forEach(function(p, i) { svg += '<circle cx="' + X(i).toFixed(1) + '" cy="' + Y(p[s.key]).toFixed(1) + '" r="5" fill="' + s.color + '"><title>' + p.label + ' · ' + s.name + ': ' + fmtNum(p[s.key]) + '</title></circle>'; });
    var first = pts[0], last = pts[pts.length - 1];
    svg += '<text x="' + (X(0) - 10) + '" y="' + (Y(first[s.key]) + 4) + '" text-anchor="end" fill="' + s.color + '" font-size="11.2" font-weight="800">' + s.name + ': ' + fmtNum(first[s.key]) + '</text>' +
      '<text x="' + (X(pts.length - 1) + 10) + '" y="' + (Y(last[s.key]) + 4) + '" fill="' + s.color + '" font-size="11.2" font-weight="800">' + fmtNum(last[s.key]) + '</text>';
  });
  pts.forEach(function(p, i) { svg += '<text class="axis-txt" x="' + X(i).toFixed(1) + '" y="' + (H - 10) + '" text-anchor="middle">' + p.label + '</text>'; });
  host.innerHTML = '<svg width="100%" height="100%" viewBox="0 0 ' + W + ' ' + H + '">' + svg + '</svg>';
}

window.addEventListener('message', function(evt) {
  var m = evt.data || {};
  if (!m || typeof m !== 'object' || !Array.isArray(m.columns) || !Array.isArray(m.data)) return;
  try {
    window.__lastRows = detailFromVA(m);
    employeeSlope(document.getElementById('chart'), window.__lastRows);
    document.getElementById('error').style.display = 'none';
  } catch (e) {
    document.getElementById('error').textContent = e.message;
    document.getElementById('error').style.display = 'block';
  }
});
window.addEventListener('resize', function() { if (window.__lastRows) employeeSlope(document.getElementById('chart'), window.__lastRows); });

try { if (window.parent) window.parent.postMessage({ type: 'ready', object: 'gob-005-emp-chart' }, '*'); } catch (e) {}

/* Datos de muestra para previsualización standalone (sin conexión a VA) */
window.__lastRows = [
  { mesNum: 10, emp_decl: 116200, emp_imss: 156800 },
  { mesNum: 11, emp_decl: 119800, emp_imss: 163400 },
  { mesNum: 12, emp_decl: 121660, emp_imss: 166000 }
];
employeeSlope(document.getElementById('chart'), window.__lastRows);
</script>

</body>
</html>
